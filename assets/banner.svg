    <text x="107" y="32" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">ENGINEERING PILLARS</text>
    <line x1="20" y1="44" x2="195" y2="44" stroke="#1e3a5f" stroke-width="1" />
    <text x="25" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">⚡ 100% Deterministic Tests</text>
    <text x="25" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🛡️ Zero Race Conditions</text>
    <text x="25" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🚀 Production Zero-Handholding</text>
