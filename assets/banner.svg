<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <!-- Solid High-Tech Background -->
  <rect width="1200" height="280" rx="12" fill="#070b14" stroke="#1e293b" stroke-width="2" />

  <!-- Cyan Top Accent Glow Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="#00e5ff" />

  <!-- Corner Tech Brackets -->
  <path d="M 24 45 L 24 24 L 45 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1176 45 L 1176 24 L 1155 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 24 235 L 24 256 L 45 256" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1176 235 L 1176 256 L 1155 256" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Accent Cyan Bar -->
  <rect x="50" y="55" width="5" height="170" rx="2.5" fill="#00e5ff" />

  <!-- Main Identity Header -->
  <text x="75" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="3">GAURANG AGARWAL</text>

  <!-- Professional Subtitle -->
  <text x="75" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5">SENIOR QA ENGINEER (7+ YRS) &amp; BACKEND DEVELOPER</text>

  <!-- Core Competencies Chips Row -->
  <!-- Chip 1 -->
  <g transform="translate(75, 175)">
    <rect width="210" height="40" rx="6" fill="#0f172a" stroke="#00e5ff" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#00e5ff" />
    <text x="34" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Python · Django · Celery</text>
  </g>

  <!-- Chip 2 -->
  <g transform="translate(300, 175)">
    <rect width="225" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#38bdf8" />
    <text x="34" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">PostgreSQL · Redis · Docker</text>
  </g>

  <!-- Chip 3 -->
  <g transform="translate(540, 175)">
    <rect width="265" height="40" rx="6" fill="#0f172a" stroke="#00e5ff" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#00e5ff" />
    <text x="34" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Playwright · Pytest · Concurrency</text>
  </g>

  <!-- Right Side Tech Badge -->
  <g transform="translate(930, 75)">
